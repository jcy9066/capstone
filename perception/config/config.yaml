stream:
  rtsp_url: "rtsp://<RASPBERRY_PI_IP>:8554/stream"
  ir_night_mode: true  # IR-CUT 카메라 야간(흑백) 모드 텐서 정규화 적용 여부

models:
  yolov10_weights: "weights/yolov10x.pt"
  rtmpose_weights: "weights/rtmpose-m_simcc-body7_pt-body7.pth"
  poseconv3d_weights: "weights/poseconv3d_k400.pth"
  device: "cuda:0"

thresholds:
  spatial_iou: 0.15          # 폭행 의심 Bounding Box 겹침 비율 (테스트 시 0.4로 상향)
  spatial_dist_pixel: 120    # 중심점 간 픽셀 거리 임계값
  temporal_frames: 5         # 해당 상태가 유지되어야 하는 최소 프레임 수
  confidence: 0.6            # 객체 탐지 신뢰도

alerts:
  webhook_url: "https://<YOUR_N8N_OR_SLACK_WEBHOOK_URL>" # 이상 상황 탐지 시 알림 전송용